<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Stock ER - จัดการ Staff & Role</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { corePlugins: { preflight: true } } </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800">👥 ระบบจัดการ Staff & Role (ผู้ใช้งาน)</h1>
                <p class="text-xs text-slate-500">ลงทะเบียนผู้ใช้งานและกำหนดสิทธิ์เข้าถึงคลังสต๊อก</p>
            </div>
            <a href="./dashboard.html" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-2 px-4 rounded-xl transition">
                กลับหน้า Dashboard 📊
            </a>
        </div>

        <!-- ฟอร์มเพิ่ม Staff ใหม่ -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-4 border-b pb-2">➕ เพิ่ม Staff / ผู้ใช้งานใหม่</h2>
            <form id="staffForm" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสประจำตัว / Staff ID</label>
                    <input type="text" id="staffCode" required placeholder="เช่น ST-001" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อ-นามสกุล</label>
                    <input type="text" id="fullName" required placeholder="เช่น สุชาติ ใจดี" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">สิทธิ์การใช้งาน (Role)</label>
                    <select id="staffRole" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="SUB_STAFF">🩺 Staff คลังย่อย (คนกระจาย Set)</option>
                        <option value="CENTRAL_ADMIN">📦 Admin คลังใหญ่</option>
                        <option value="SUPER_ADMIN">👑 Super Admin</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition">
                        บันทึกข้อมูล Staff
                    </button>
                </div>
            </form>
        </div>

        <!-- รายชื่อ Staff ในระบบ -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-4 border-b pb-2">📋 รายชื่อ Staff ทั้งหมดในระบบ</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-600">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-50 border-b">
                        <tr>
                            <th class="px-4 py-3">Staff ID</th>
                            <th class="px-4 py-3">ชื่อ-นามสกุล</th>
                            <th class="px-4 py-3">Role (สิทธิ์)</th>
                            <th class="px-4 py-3">UUID (User ID)</th>
                            <th class="px-4 py-3 text-center">การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <tr>
                            <td colspan="5" class="text-center py-4 text-slate-400">กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module" src="./js/staff.js"></script>
</body>
</html>
