<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Stock ER - เปลี่ยนรหัสผ่าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { corePlugins: { preflight: true } } </script>
    <!-- 🌟 SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- 🅰️ Google Font Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body, .swal2-popup { 
            font-family: 'Prompt', sans-serif !important; 
        } 
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8 space-y-6">
        <div class="text-center">
            <img src="https://wddkaxdspxgaafuajpms.supabase.co/storage/v1/object/public/LOGO/ER_EMS%20LOGO.png" 
                 alt="ER EMS Logo" 
                 class="h-20 mx-auto mb-2 object-contain mix-blend-multiply">
            <h1 class="text-xl font-bold text-slate-800">🔑 ตั้งรหัสผ่านใหม่</h1>
            <p class="text-xs text-slate-500 mt-1">กรุณาตั้งรหัสผ่านใหม่ส่วนตัวเพื่อความปลอดภัยในการเข้าใช้งาน</p>
        </div>

        <form id="resetPasswordForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
                <input type="password" id="newPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ยืนยันรหัสผ่านใหม่</label>
                <input type="password" id="confirmPassword" required placeholder="••••••••" class="w-full px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 outline-none">
            </div>

            <button type="submit" id="btnSavePassword" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-xl text-sm transition active:scale-95 shadow-md">
                บันทึกรหัสผ่านใหม่ & เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script type="module" src="./js/reset-password.js"></script>
</body>
</html>
