<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Stock ER - เข้าสู่ระบบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> tailwind.config = { corePlugins: { preflight: true } } </script>
    <!-- 🌟 SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- 🅰️ Google Font Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body, .swal2-popup { 
            font-family: 'Prompt', sans-serif !important; 
        } 
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
        
        <div class="text-center mb-6">
            <img src="https://wddkaxdspxgaafuajpms.supabase.co/storage/v1/object/public/LOGO/ER_EMS%20LOGO.png" 
                 alt="ER EMS Logo" 
                 class="h-32 mx-auto mb-2 object-contain mix-blend-multiply">
            <h1 class="text-2xl font-bold text-slate-800">🏥 D-Stock ER</h1>
            <p class="text-sm text-slate-500 mt-1">ระบบบริหารจัดการสต๊อกเวชภัณฑ์ห้องฉุกเฉิน</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">อีเมล / บัญชีผู้ใช้งาน</label>
                <input type="email" id="email" required placeholder="staff@hospital.com" class="w-full px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่าน</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 outline-none">
            </div>

            <button type="submit" id="btnLogin" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-xl text-sm transition active:scale-95 shadow-md">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-400">
            <p>หากลืมรหัสผ่าน กรุณาติดต่อ Admin เพื่อขอรีเซ็ตรหัสผ่าน</p>
        </div>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
